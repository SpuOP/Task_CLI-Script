[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "resolution-week1-spuop"
version = "0.1.0"
description = "A simple Python CLI task manager"
readme = "README.md"
requires-python = ">=3.8"
authors = [
  { name = "Spandan Gautam" }
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
task-cli = "resolution_week1_spuop.main:main"